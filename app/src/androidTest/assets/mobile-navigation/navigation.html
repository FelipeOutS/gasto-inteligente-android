@keyframes badge-pop {

    opacity: 0;
  }
  60% {
    transform: scale(1.15);
    opacity: 1;
  }
  100% {
    transform: scale(1);
    opacity: 1;
  }
}
@media (prefers-reduced-motion: reduce) {
  .animate-rise, .animate-pop, .page-enter, .animate-pulse-soft, .animate-shake, .animate-fill, .animate-breathe, .stagger > *, .skeleton-shimmer {

  .hover-lift:hover {

.bank-logo-container {
  width: 170px;
  height: 46px;
  max-width: 170px;
  max-height: 46px;
  flex-shrink: 0;
  display: inline-flex;
  align-items: center;
  justify-content: flex-start;
  overflow: hidden;
}
.bank-logo-container > img, .bank-logo-container > svg {
  max-width: 170px;
  max-height: 38px;
  width: auto;
  height: auto;
  object-fit: contain;
  object-position: left center;
  display: block;
}
.bank-logo-container.bank-logo-wide > img, .bank-logo-container.bank-logo-wide > svg {
  max-height: 42px;
}
.bank-logo-container.bank-logo-sm {
  width: 56px;
  height: 28px;
  max-width: 56px;
  max-height: 28px;
}
.bank-logo-container.bank-logo-sm > img, .bank-logo-container.bank-logo-sm > svg {

}
.scrollbar-none::-webkit-scrollbar {
  display: none;
}
.scrollbar-none {
  -ms-overflow-style: none;
  scrollbar-width: none;
}
.no-scrollbar::-webkit-scrollbar {
  display: none;
}
.no-scrollbar {
  -ms-overflow-style: none;
  scrollbar-width: none;
}
.gi-sidebar-scroll {
  overflow-y: auto;
  overscroll-behavior: contain;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: thin;
  scrollbar-color: var(--muted-foreground) transparent;
  @supports (color: color-mix(in lab, red, red)) {
    scrollbar-color: color-mix(in oklab, var(--muted-foreground) 16%, transparent) transparent;
  }
  transition: scrollbar-color 200ms ease;
}
.gi-sidebar-scroll:hover, .gi-sidebar-scroll[data-scrolling="true"] {
  scrollbar-color: var(--muted-foreground) transparent;
  @supports (color: color-mix(in lab, red, red)) {
    scrollbar-color: color-mix(in oklab, var(--muted-foreground) 38%, transparent) transparent;
  }
}
.gi-sidebar-scroll::-webkit-scrollbar {
  width: 6px;
}
.gi-sidebar-scroll::-webkit-scrollbar-track {
  background: transparent;
}
.gi-sidebar-scroll::-webkit-scrollbar-button {
  display: none;
  height: 0;
  width: 0;
}
.gi-sidebar-scroll::-webkit-scrollbar-corner {
  background: transparent;
}
.gi-sidebar-scroll::-webkit-scrollbar-thumb {
  background-color: var(--muted-foreground);
  @supports (color: color-mix(in lab, red, red)) {
    background-color: color-mix(in oklab, var(--muted-foreground) 16%, transparent);
  }
  border-radius: 9999px;
  transition: background-color 200ms ease, opacity 200ms ease;
}
.gi-sidebar-scroll:hover::-webkit-scrollbar-thumb, .gi-sidebar-scroll[data-scrolling="true"]::-webkit-scrollbar-thumb {
  background-color: var(--muted-foreground);
  @supports (color: color-mix(in lab, red, red)) {
    background-color: color-mix(in oklab, var(--muted-foreground) 34%, transparent);
  }
}
.gi-sidebar-scroll::-webkit-scrollbar-thumb:hover, .gi-sidebar-scroll::-webkit-scrollbar-thumb:active {
  background-color: var(--muted-foreground);
  @supports (color: color-mix(in lab, red, red)) {
    background-color: color-mix(in oklab, var(--muted-foreground) 50%, transparent);
  }
}
@keyframes banks-marquee {
  from {
    transform: translateX(0);
  }
  to {
    transform: translateX(-50%);
  }
}
.banks-marquee-track {
  animation: banks-marquee 38s linear infinite;
  width: max-content;
}
.banks-marquee:hover .banks-marquee-track {
  animation-play-state: paused;
}
@media (max-width: 640px) {
  .banks-marquee-track {
    animation-duration: 28s;
  }
}
@keyframes brand-pulse {
  0%, 100% {
    opacity: 0.85;
    transform: scale(1);
  }
  50% {
    opacity: 1;
    transform: scale(1.04);
  }
}
.ai-markdown {
  color: var(--foreground);
}
.ai-markdown > *:first-child {
  margin-top: 0;
}
.ai-markdown > *:last-child {
  margin-bottom: 0;
}
.ai-markdown p {
  margin: 0.35rem 0;
  line-height: 1.55;
}
.ai-markdown strong {
  font-weight: 600;
  color: inherit;
}
.ai-markdown em {
  font-style: italic;
}
.ai-markdown ul, .ai-markdown ol {
  margin: 0.4rem 0;
  padding-left: 1.1rem;
}
.ai-markdown ul {
  list-style: disc;
}
.ai-markdown ol {
  list-style: decimal;
}
.ai-markdown li {
  margin: 0.18rem 0;
  line-height: 1.5;
}
.ai-markdown li::marker {
  color: var(--primary);
}
.ai-markdown h1, .ai-markdown h2, .ai-markdown h3, .ai-markdown h4 {
  font-weight: 700;
  margin: 0.6rem 0 0.3rem;
  line-height: 1.3;
}
.ai-markdown h1 {
  font-size: 1rem;
}
.ai-markdown h2 {
  font-size: 0.95rem;
}
.ai-markdown h3, .ai-markdown h4 {
  font-size: 0.9rem;
}
.ai-markdown a {
  color: var(--primary);
  text-decoration: underline;
}
.ai-markdown code {
  background: var(--muted);
  @supports (color: color-mix(in lab, red, red)) {
    background: color-mix(in oklab, var(--muted) 60%, transparent);
  }
  padding: 0.05rem 0.3rem;
  border-radius: 0.3rem;
  font-size: 0.85em;
}
.ai-markdown pre {
  background: var(--muted);
  @supports (color: color-mix(in lab, red, red)) {
    background: color-mix(in oklab, var(--muted) 60%, transparent);
  }
  padding: 0.6rem 0.75rem;
  border-radius: 0.6rem;
  overflow-x: auto;
  margin: 0.4rem 0;
}
.ai-markdown blockquote {
  border-left: 3px solid var(--primary);
  @supports (color: color-mix(in lab, red, red)) {
    border-left: 3px solid color-mix(in oklab, var(--primary) 40%, transparent);
  }
  padding-left: 0.7rem;
  color: var(--muted-foreground);
  margin: 0.4rem 0;
}
:root {
  --mobile-nav-height: 68px;
  --mobile-nav-bottom: calc(12px + env(safe-area-inset-bottom, 0px));
  --mobile-nav-clearance: calc(var(--mobile-nav-height) + var(--mobile-nav-bottom) + 32px);
}
.mobile-bottom-nav {
  position: fixed;
  z-index: 40;
  bottom: var(--mobile-nav-bottom);
  left: 50%;
  width: min(calc(100% - 24px), 460px);
  height: var(--mobile-nav-height);
  transform: translateX(-50%);
  padding: 5px 6px;
  border-radius: 999px;
  border: 1px solid var(--border);
  background: var(--card);
  box-shadow: 0 8px 28px rgb(0 0 0 / 0.14), inset 0 1px 0 var(--foreground);
  @supports (color: color-mix(in lab, red, red)) {
    box-shadow: 0 8px 28px rgb(0 0 0 / 0.14), inset 0 1px 0 color-mix(in srgb, var(--foreground) 5%, transparent);
  }
  isolation: isolate;
}
@supports (backdrop-filter: blur(12px)) {
  .mobile-bottom-nav {
    background: var(--card);
    @supports (color: color-mix(in lab, red, red)) {
      background: color-mix(in srgb, var(--card) 91%, transparent);
    }
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
  }
}
.mobile-bottom-nav[hidden] {
  display: none;
}
.mobile-nav-track {
  position: relative;
  display: flex;
  height: 100%;
  margin: 0;
  padding: 0;
  list-style: none;
}
.mobile-nav-item {
  flex: 1;
  min-width: 0;
}
.mobile-nav-link {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 4px;
  height: 100%;
  min-height: 44px;
  min-width: 44px;
  border-radius: 999px;
  color: var(--muted-foreground);
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
  transition: color 180ms ease;
}
.mobile-nav-link[aria-current="page"] {
  color: var(--brand-fg-on-soft, var(--foreground));
}
.mobile-nav-link:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 1px;
}
.mobile-nav-icon {
  position: relative;
  display: grid;
  place-items: center;
  width: 44px;
  height: 32px;
  transition: transform 160ms ease;
}
.mobile-nav-link:active .mobile-nav-icon {
  transform: scale(0.96);
}
.mobile-nav-link[aria-current="page"] .mobile-nav-icon {
  animation: mobile-nav-settle 280ms ease-out;
}
.mobile-nav-label {
  max-width: 100%;
  font-size: 10px;
  font-weight: 600;
  line-height: 12px;
  white-space: nowrap;
}
.mobile-nav-dot {
  position: absolute;
  top: 2px;
  right: 5px;
  width: 6px;
  height: 6px;
  border-radius: 50%;
}
.mobile-nav-indicator {
  position: absolute;
  top: 1px;
  left: 0;
  width: 20%;
  height: 36px;
  pointer-events: none;
  transition: transform 300ms cubic-bezier(0.22, 0.8, 0.25, 1), opacity 160ms ease;
}
.mobile-nav-indicator > span {
  display: block;
  width: 50px;
  max-width: 90%;
  height: 100%;
  margin: auto;
  border-radius: 999px;
  background: var(--brand-soft, var(--accent));
}
@keyframes mobile-nav-settle {
  0% {
    transform: scale(0.97);
  }
  55% {
    transform: scale(1.04);
  }
  100% {
    transform: scale(1);
  }
}
@media (prefers-reduced-motion: reduce) {
  .mobile-nav-indicator, .mobile-nav-icon, .mobile-nav-link {
    transition: none;
    animation: none !important;
  }
}

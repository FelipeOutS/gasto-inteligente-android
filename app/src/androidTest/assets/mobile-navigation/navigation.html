.mobile-nav-create:active {
  transform: scale(0.96);
}
.mobile-nav-create:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 3px;
}
.mobile-nav-link:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 1px;
}
.mobile-nav-icon {
  position: relative;
  display: grid;
  place-items: center;
  width: 44px;
  height: 32px;
  transition: transform 100ms ease-out;
}
.mobile-nav-link:active .mobile-nav-icon {
  transform: scale(0.96);
  transition-duration: 0ms;
}
.mobile-nav-dot {
  position: absolute;
  top: 2px;
  right: 5px;
  width: 6px;
  height: 6px;
  border-radius: 50%;
}
.mobile-nav-indicator {
  position: absolute;
  top: 50%;
  margin-top: -24px;
  left: 0;
  width: 20%;
  height: 48px;
  pointer-events: none;
  transition: opacity 120ms ease;
}
.mobile-nav-indicator > span {
  display: block;
  width: 50px;
  max-width: 90%;
  height: 100%;
  margin: auto;
  border-radius: 999px;
  background: color-mix(in srgb, #20aa6c 16%, transparent);
}
@media (prefers-reduced-motion: reduce) {
  .mobile-nav-indicator, .mobile-nav-icon, .mobile-nav-create, .mobile-nav-link {
    transition: none;
    animation: none !important;
  }
}
@media (min-width: 640px) and (max-width: 767px) {
  main:has(> .cartoes-page) {
    max-width: 48rem;
  }
}
@media (min-width: 768px) and (max-width: 1023px) {
  .cartoes-page .cartoes-carousel-item {
    width: 48%;
  }
}
.cartoes-form-dialog > button[aria-label="Fechar"] {
  width: 44px;
  height: 44px;
  top: 8px;
  right: 8px;
}
.gi-safe-full {
  padding-top: var(--app-safe-top);
  padding-bottom: var(--app-safe-bottom);
  padding-left: var(--app-safe-left);
  padding-right: var(--app-safe-right);
}
[data-safe-sheet="top"], [data-safe-sheet="left"], [data-safe-sheet="right"] {
  padding-top: calc(var(--app-safe-top) + 1.5rem);
  padding-bottom: calc(var(--app-safe-bottom) + 1.5rem);
}
[data-safe-sheet] {
  padding-left: max(1.5rem, var(--app-safe-left));
  padding-right: max(1.5rem, var(--app-safe-right));
}
[data-safe-sheet="top"] > button[aria-label="Fechar"], [data-safe-sheet="left"] > button[aria-label="Fechar"], [data-safe-sheet="right"] > button[aria-label="Fechar"] {
  top: calc(var(--app-safe-top) + 1rem);
}
@media (orientation: landscape) {
  .mobile-shell-content, .auth-shell {
    padding-left: max(1.5rem, var(--app-safe-left));
    padding-right: max(1.5rem, var(--app-safe-right));
  }
}
[data-safe-dialog] {
  left: max(1rem, var(--app-safe-left));
  right: max(1rem, var(--app-safe-right));
}
[data-safe-sheet] > button[aria-label="Fechar"] {
  right: max(1rem, var(--app-safe-right));
}
.cartoes-form-dialog {
  padding-left: var(--app-safe-left);
  padding-right: var(--app-safe-right);
}
@media (min-width: 1024px) {
  .mobile-shell-content {
    padding-top: max(1.25rem, var(--app-safe-top));
  }
}
[data-safe-drawer] {
  padding-left: var(--app-safe-left);
  padding-right: var(--app-safe-right);
}
